<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华智慧停车运营中心</title><link rel="stylesheet" href="/styles.css"><style>:root{--accent:#315c9b;--accent-soft:#e6eef9;--nav:#18283f}</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><span class="logo">ZH</span><div>知华停车<small>SMART PARKING</small></div></div><nav class="nav"><div class="active">车场总览</div><div>车辆通行</div><div>车位管理</div><div>收费规则</div><div>月卡用户</div><div>商户优惠</div><div>支付对账</div><div>设备运维</div></nav><div class="sidebar-foot">上海如静知华信息科技有限公司</div></aside><main class="main"><header class="top"><div><h1>停车运营总览</h1><div class="muted">车位利用、车辆通行和停车收入实时监控</div></div><span class="status"><i class="dot"></i>出入口在线</span></header><section class="metrics" id="metrics"></section><div class="grid"><section class="card"><div class="section-title"><h2>场内车辆</h2><button class="button">人工入场</button></div><div class="table-wrap"><table class="table"><thead><tr><th>车牌</th><th>车位</th><th>入场时间</th><th>应付</th><th>状态</th></tr></thead><tbody id="records"></tbody></table></div></section><aside class="card"><div class="section-title"><h2>车位分布</h2><span class="muted">22个车位</span></div><div id="spaces" class="mini-grid"></div></aside></div><div class="grid equal"><section class="card"><div class="section-title"><h2>支付流水</h2><span class="pill">自动对账</span></div><div id="payments"></div></section><section class="card"><div class="section-title"><h2>经营指标</h2><span class="muted">本日</span></div><div class="mini-grid"><div class="mini"><span class="muted">平均停留</span><strong>1.8 h</strong></div><div class="mini"><span class="muted">无感支付率</span><strong>86.2%</strong></div><div class="mini"><span class="muted">道闸抬杆率</span><strong>99.7%</strong></div><div class="mini"><span class="muted">优惠核销</span><strong>1 笔</strong></div></div></section></div></main></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/dashboard',{headers:{'x-api-key':'zhuatech-demo-key'}}).then(r=>r.json()).then(d=>{const labels={lots:'停车场',spaces:'总车位',available:'可用车位',occupied:'占用车位',utilization:'利用率',revenue:'停车收入',parked:'在场车辆'};metrics.innerHTML=Object.entries(d.metrics).slice(0,5).map(([k,v])=>`<div class="card metric"><span class="muted">${labels[k]}</span><strong>${v}${k==='utilization'?'%':''}</strong><em>实时</em></div>`).join('');records.innerHTML=d.records.filter(x=>x.status!=='exited').map(x=>`<tr><td><strong>${esc(x.plate)}</strong></td><td>${esc(d.spaces.find(s=>s.id===x.spaceId)?.code||'--')}</td><td>${new Date(x.entryAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</td><td>¥${x.payable.toFixed(2)}</td><td><span class="pill ${x.status==='parked'?'warning':''}">${esc(x.status)}</span></td></tr>`).join('');spaces.innerHTML=['standard','ev'].map(type=>{const list=d.spaces.filter(x=>x.type===type);return `<div class="mini"><span class="muted">${type==='ev'?'充电车位':'普通车位'}</span><strong>${list.filter(x=>x.status==='available').length}/${list.length}</strong><div class="progress"><i style="width:${list.length?list.filter(x=>x.status!=='available').length/list.length*100:0}%"></i></div></div>`}).join('');payments.innerHTML=d.payments.map(x=>`<div class="list-row"><div><strong>${esc(x.tradeNo)}</strong><span class="muted">${esc(x.channel)} · ${new Date(x.paidAt).toLocaleTimeString('zh-CN')}</span></div><strong>¥${x.amount.toFixed(2)}</strong></div>`).join('')})</script></body></html>
